name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LogCamera-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LogCamera.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LogCamera.apk --title "LogCamera 최신 빌드" --notes "커밋 ${GITHUB_SHA::7}"
